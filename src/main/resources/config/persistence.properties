# Persistence Configuration
#=================================================
# DATABASE CONFIGURATIONs

# Jackson Properties
spring.jackson.visibility.getter=public-only
spring.jackson.visibility.setter=public-only

# Hibernate properties
spring.jpa.show-sql=false
# Schema is managed by Flyway (src/main/resources/db/migration); Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway: existing databases without history are marked as version 1 (baseline) instead of being migrated
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
